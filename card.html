<script>
function downloadVCard() {
  const lines = [
    'BEGIN:VCARD',
    'VERSION:3.0',
    'N:馮;淑英;;;',
    'FN:馮淑英',
    'ORG:檸檬手作工作坊',
    'TITLE:AI 老師',
    'EMAIL;TYPE=INTERNET,WORK:bennettfong@gmail.com',
    'URL:https://benettonfeng.github.io/shuying-ai/',
    'X-SOCIALPROFILE;TYPE=facebook:https://www.facebook.com/profile.php?id=100065103249213',
    'X-SOCIALPROFILE;TYPE=line:https://line.me/ti/p/~benettonfeng',
    'NOTE:上班族 AI 教學; 樂齡 AI 教學; 一頁式網站設計',
    'END:VCARD'
  ];
  const blob = new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = '馮淑英.vcf';
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  toast('聯絡人已準備好');
}

function shareCard() {
  const shareData = { title: '馮淑英｜AI 老師', text: '馮淑英 AI 老師', url: window.location.href };
  if (navigator.share) {
    navigator.share(shareData).catch(function() {});
    return;
  }
  navigator.clipboard.writeText(window.location.href)
    .then(function() { toast('連結已複製'); })
    .catch(function() { toast('目前無法分享連結'); });
}

function toast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function() { el.classList.remove('show'); }, 1800);
}
</script>
