<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390, initial-scale=1.0">
<title>馮淑英 - AI生活應用講師</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0f7f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    font-family: 'Noto Sans TC', sans-serif;
  }

  .card {
    width: 390px;
    background: #ffffff;
    min-height: 844px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 28px 0;
    position: relative;
    box-shadow: 0 8px 40px rgba(60,130,60,0.10);
  }

  /* TOP BANNER */
  .top-banner {
    width: 100%;
    background: linear-gradient(135deg, #2e7d32 0%, #43a047 60%, #66bb6a 100%);
    padding: 28px 20px 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow: visible;
  }

  .lemon-icon {
    font-size: 1.5rem;
    margin-right: 6px;
  }

  .workshop-title {
    color: #fff;
    font-size: 1.35rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  .workshop-subtitle {
    color: rgba(255,255,255,0.85);
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    margin-top: 4px;
    font-weight: 300;
  }

  /* GREEN WAVE */
  .wave-svg {
    width: 100%;
    display: block;
    margin-top: -1px;
  }

  /* DOLL SECTION */
  .doll-section {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: -10px;
    padding: 0 20px;
  }

  .doll-img {
    width: 180px;
    height: 180px;
    object-fit: contain;
    filter: drop-shadow(0 6px 18px rgba(60,130,60,0.18));
  }

  /* NAME SECTION */
  .name-section {
    width: 100%;
    text-align: center;
    padding: 10px 20px 0 20px;
  }

  .name {
    font-size: 2rem;
    font-weight: 900;
    color: #1b5e20;
    letter-spacing: 0.12em;
    line-height: 1.1;
  }

  .title {
    font-size: 0.95rem;
    color: #43a047;
    font-weight: 500;
    letter-spacing: 0.2em;
    margin-top: 6px;
  }

  /* DIVIDER */
  .divider {
    width: 60px;
    height: 3px;
    background: linear-gradient(90deg, #43a047, #a5d6a7);
    border-radius: 2px;
    margin: 14px auto 0 auto;
  }

  /* SERVICE GRID */
  .service-section {
    width: 100%;
    padding: 16px 20px 0 20px;
  }

  .service-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .service-item {
    background: linear-gradient(135deg, #f1f8e9 0%, #e8f5e9 100%);
    border: 1.5px solid #c8e6c9;
    border-radius: 14px;
    padding: 16px 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .service-item::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #43a047, #81c784);
    border-radius: 14px 0 0 14px;
  }

  .service-icon {
    font-size: 1.5rem;
    display: block;
    margin-bottom: 6px;
  }

  .service-name {
    font-size: 0.82rem;
    font-weight: 700;
    color: #2e7d32;
    letter-spacing: 0.06em;
    line-height: 1.4;
  }

  /* QR SECTION */
  .qr-section {
    width: 100%;
    padding: 18px 20px 0 20px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .qr-box {
    background: #f9fbe7;
    border: 1.5px solid #c8e6c9;
    border-radius: 16px;
    padding: 14px 10px 12px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .qr-label {
    font-size: 0.78rem;
    font-weight: 700;
    color: #2e7d32;
    letter-spacing: 0.08em;
    text-align: center;
    line-height: 1.4;
  }

  .qr-img {
    width: 120px;
    height: 120px;
    object-fit: contain;
    border-radius: 8px;
    display: block;
  }

  /* FOOTER */
  .footer {
    width: 100%;
    padding: 18px 20px 0 20px;
    text-align: center;
  }

  .website-label {
    font-size: 0.72rem;
    color: #81c784;
    letter-spacing: 0.15em;
    font-weight: 400;
    margin-bottom: 4px;
  }

  .website-url {
    font-size: 0.8rem;
    color: #2e7d32;
    font-weight: 700;
    letter-spacing: 0.03em;
    word-break: break-all;
  }

  .bottom-bar {
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, #2e7d32, #66bb6a, #2e7d32);
    margin-top: 18px;
    border-radius: 0 0 0 0;
  }
</style>
</head>
